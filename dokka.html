<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vännen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/friend.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/buttons.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/activities.css">
<link rel="stylesheet" href="css/backpack.css">
<link rel="stylesheet" href="css/storybook.css">
<link rel="stylesheet" href="css/factbook.css">
<link rel="stylesheet" href="css/recipebook.css">
<link rel="stylesheet" href="css/discoverbook.css">
<link rel="stylesheet" href="css/photoalbum.css">
</head>
<body>
<main id="app">
<!-- ORIENTERINGSVARNING -->
<div id="orientation-warning">
<div class="orientation-warning-content">
    <div class="orientation-warning-icon">
        🐶
    </div>
    <h2>Vänd på din enhet</h2>
    <p>
        Vännen fungerar bäst när du håller enheten stående.
    </p>
</div>
</div>
<!-- DOKKAS VÄNSIDA -->
<section id="friend-view">
<div class="top-buttons">
<button id="about-button">
Om oss ♡
</button>
<button id="goodbye-button">
👋 Hej då
</button>
🌙 Kväll med
</button>
</div>
<!-- DOKKA SCEN -->
<div id="otis-stage">
<header id="friend-profile">
<div id="friend-bubble"></div>
<div id="friend-overlay">
<h1 id="friend-name"></h1>
<div class="friend-divider">
─── ♡ ───
</div>
</div>
</header>
<nav id="actions">
<!-- Skapas av ui.js -->
</nav>
</div>
<div id="activity-timer" class="activity-hidden">
<div id="timer-time">
10:00
</div>
<div id="timer-text">
Dokka är här med dig under tiden 🌿
</div>
</div>
<section id="chat">
<div id="messages"></div>
</section>
</section>
<!-- RYGGSÄCKSVY -->
<section id="backpack-view" style="display:none;">
🐾 Tillbaka till
</button>
</section>
<!-- SAGOBOK -->
<section id="storybook" style="display:none;">
🎒 Tillbaka till ryggsäcken
</button>
←
</button>
<!-- Kapitelrubrik -->
<div id="storybook-title"></div>
<!-- Text på boksidor -->
<div id="storybook-text"></div>
<!-- Innehållsförteckning -->
<div id="storybook-content">
<h1>
Innehållsförteckning
</h1>
<button onclick="goToChapter(1)">
Kapitel 1<br>
<span>
Spåret i skogen
</span>
</button>
<button onclick="goToChapter(2)">
Kapitel 2<br>
<span>
När Bosse mötte Otis
</span>
</button>
<button onclick="showComingSoon()">
Kapitel 3<br>
<span>
Kommer snart
</span>
</button>
</div>
📚 Vi har läst en stund
</button>
→
</button>
</section>
<!-- FAKTABOK -->
<section id="factbook" style="display:none;">
<button
    id="factbook-close"
    onclick="closeFactBook()">
    🎒 Tillbaka till ryggsäcken
</button>
<button
    id="factbook-prev"
    onclick="changeFactPage(-1)">
    ←
</button>
<img
    id="factbook-background"
    src="images/Bosse/factbook/bosse-backpack-item-faktabok-openl.PNG"
    alt="Faktabok sida">
<img
    id="factbook-page"
    alt="Dokka faktabok">
<div id="factbook-title"></div>
<div id="factbook-text"></div>
<div id="factbook-content">
    <h1>Innehållsförteckning</h1>
    <button onclick="goToFactChapter(1)">
        Kapitel 1<br>
        <span>Grävlingar</span>
    </button>
    <button onclick="goToFactChapter(2)">
        Kapitel 2<br>
        <span>Uttrar</span>
    </button>
    <button onclick="showComingSoon()">
        Kapitel 3<br>
        <span>Kommer snart</span>
    </button>
</div>
<button
    id="factbook-read"
    class="storybook-read-button"
    onclick="factBookReadingDone()"
    style="display:none;">
    🔍 Vi har upptäckt något nytt
</button>
<button
    id="factbook-next"
    onclick="changeFactPage(1)">
    →
</button>
</section>
<!-- RECEPTBOK -->
<section id="recipebook" style="display:none;">
<button
    id="recipebook-close"
    onclick="closeBook()">
    🎒 Tillbaka till ryggsäcken
</button>
<button
    id="recipebook-prev"
    onclick="changeBookPage(-1)">
    ←
</button>
<img
    id="recipebook-background"
    src="images/Bosse/recipebook/bosse-backpack-item-receptbok-openl.PNG"
    alt="Receptbok sida">
<img
    id="recipebook-page"
    alt="Dokka receptbok">
<div id="recipebook-title"></div>
<div id="recipebook-text"></div>
<div id="recipebook-content">
    <h1>Innehåll</h1>
    <h2>Mellanmål</h2>
    <button onclick="goToBookPage(2)">
        <span>Bosses Pannkaksbröd</span>
    </button>
    <button onclick="goToBookPage(4)">
        <span>Kaneläpplen</span>
    </button>
    <h2>Fika</h2>
    <button onclick="goToBookPage(1)">
        <span>Otis Kryddmuffins</span>
    </button>
    <button onclick="goToBookPage(3)">
        <span>Ananas- och mangoglass</span>
    </button>
</div>
<button
    id="recipebook-next"
    onclick="changeBookPage(1)">
    →
</button>
</section>
<!-- UPPTÄCKARBOK -->
<section id="discoverbook" style="display:none;">
<button
    id="discoverbook-close"
    onclick="closeBook()">
    🎒 Tillbaka till ryggsäcken
</button>
<button
    id="discoverbook-prev"
    onclick="changeBookPage(-1)">
    ←
</button>
<img
    id="discoverbook-background"
    src="images/Bosse/discoverbook/bosse-backpack-item-upptackarbok-openl.PNG"
    alt="Upptäckarbok sida">
<img
    id="discoverbook-page"
    alt="Dokka upptäckarbok">
<div id="discoverbook-title"></div>
<div id="discoverbook-text"></div>
<div id="discoverbook-content">
    <h1>Innehåll</h1>
    <button onclick="goToBookPage(1)">
        <span>Trolldeg</span>
    </button>
    <button onclick="goToBookPage(2)">
        <span>Studsbubblor</span>
    </button>
    <button onclick="goToBookPage(3)">
        <span>Klisterballonger</span>
    </button>
    <button onclick="goToBookPage(4)">
        <span>Vänskapsarmband</span>
    </button>
    <button onclick="goToBookPage(5)">
        <span>Odla ärtskott</span>
    </button>
    <button onclick="goToBookPage(6)">
        <span>Hoppa hage</span>
    </button>
</div>
<button
    id="discoverbook-next"
    onclick="changeBookPage(1)">
    →
</button>
</section>
<!-- FOTOALBUM -->
<section id="photoalbum" style="display:none;">
<button
    id="photoalbum-close"
    onclick="closeBook()">
    🎒 Tillbaka till ryggsäcken
</button>
<button
    id="photoalbum-prev"
    onclick="changeBookPage(-1)">
    ←
</button>
<img
    id="photoalbum-background"
    src="images/Bosse/photoalbum/bosse-backpack-item-fotoalbum-openl.PNG"
    alt="Fotoalbum">
<div id="photoalbum-photos"></div>
<button
    id="photoalbum-next"
    onclick="changeBookPage(1)">
    →
</button>
</section>
</main>
<!-- DATA -->
<script src="data/themes.js"></script>
<!-- VÄNNER -->
<script src="data/friends/otis.js"></script>
<script src="data/friends/bosse.js"></script>
<script src="data/friends/dokka.js"></script>
<script src="data/friends/index.js"></script>
<!-- MEDDELANDEN -->
<script src="data/messages/greetings.js"></script>
<script src="data/messages/dialogs.js"></script>
<script src="data/messages/onboarding.js"></script>
<script src="data/messages/activities.js"></script>
<script src="data/messages/stories.js"></script>
<!-- FUNKTIONER -->
<script src="js/storage.js"></script>
<script src="js/memory.js"></script>
<script src="js/friends.js"></script>
<script src="data/activities/free.js"></script>
<script src="js/chat.js"></script>
<script src="js/backpack.js"></script>
<script src="js/memory-transfer.js"></script>
<script src="js/activities/math.js"></script>
<script src="js/activities/calm.js"></script>
<script src="js/activities/evening.js"></script>
<!-- BOKDATA FÖRST -->
<script src="js/storybook.js"></script>
<script src="js/factbook.js"></script>
<script src="js/recipebook.js"></script>
<script src="js/discoverbook.js"></script>
<script src="js/photoalbum.js"></script>
<!-- BOKFUNKTIONER -->
<script src="js/book.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
