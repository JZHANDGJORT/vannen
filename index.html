<!DOCTYPE html>
<html lang="sv">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vännen</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">

<!-- CSS -->

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/friend.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/buttons.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/activities.css">
<link rel="stylesheet" href="css/backpack.css">
<link rel="stylesheet" href="css/storybook.css">
<link rel="stylesheet" href="css/factbook.css">
<link rel="stylesheet" href="css/recipebook.css">
<link rel="stylesheet" href="css/photoalbum.css"> 
    
</head>


<body>

<main id="app">


<!-- STARTSIDA -->

<section id="home-view">


<section id="friend-intro">

<h1>Vännen</h1>

<p>
Små vänner som finns där för dig,
på sitt eget sätt.
</p>

</section>


<section id="friends" class="projects">


<h2>Våra vänner</h2>


<div id="friends-list" class="project-grid">

<!-- Vänkort skapas av friends.js -->

</div>


</section>


</section>





<!-- VÄNSIDA -->


<section id="friend-view" style="display:none;">


<div class="top-buttons">


<button id="about-button">
Om oss ♡
</button>


<button id="goodbye-button">
👋 Hej då
</button>

    <button
    id="evening-button"
    onclick="startEveningWithOtis()">

    🌙 Kväll med Otis

</button>

</div>




<header id="friend-profile">


<img id="friend-world" src="" alt="">


<img id="friend-stone" src="images/Otis/otis-stone.PNG" alt="">


<img id="friend-character" src="" alt="">


<img id="friend-character-face" src="" alt="">


<div id="friend-bubble"></div>



<div id="friend-overlay">


<h1 id="friend-name"></h1>


<div class="friend-divider">
─── ♡ ───
</div>


</div>




<img
id="backpack"
src="images/Otis/otis-backpack.PNG"
alt="Otis ryggsäck">


</header>





<div id="activity-timer" class="activity-hidden">

<div id="timer-time">
10:00
</div>


<div id="timer-text">
Otis är här med dig under tiden 🌿
</div>


</div>





<nav id="actions">

<!-- Skapas av ui.js -->

</nav>




<section id="chat">


<div id="messages"></div>


</section>



</section>







<!-- RYGGSÄCKSVY -->


<section id="backpack-view" style="display:none;">



<img 
id="backpack-world"
src="images/Otis/otis-backpack-open.PNG"
alt="Otis öppnade ryggsäck">





<img 
id="lasar-badge"
class="backpack-item backpack-marke-gralasar"
src="images/Otis/badge/otis-backpack-item-marke-lasargra.PNG"
alt="Läsarmärke Grå">



<img 
id="rakne-badge"
class="backpack-item backpack-marke-grarakne"
src="images/Otis/badge/otis-backpack-item-marke-raknegra.PNG"
alt="Räknemärke Grå">



<img 
id="skapar-badge"
class="backpack-item backpack-marke-graskapar"
src="images/Otis/badge/otis-backpack-item-marke-skapargra.PNG"
alt="Skaparmärke Grå">



<img 
id="upptackar-badge"
class="backpack-item backpack-marke-graupptackar"
src="images/Otis/badge/otis-backpack-item-marke-upptackargra.PNG"
alt="Upptäckarmärke Grå">





<img 
class="backpack-item backpack-chestnut-green"
src="images/Otis/otis-backpack-item-chestnut-green.PNG"
alt="Kastanj grön">




<img 
class="backpack-item backpack-oaktwig2"
src="images/Otis/otis-backpack-item-oaktwig2.PNG"
alt="Ek kvist2">





<img 
class="backpack-item backpack-receptbok"
src="images/Otis/otis-backpack-item-receptbok.PNG"
alt="Grön receptbok"
onclick="openBook('recipebook')">





<img 
class="backpack-item backpack-sagobok"
src="images/Otis/otis-backpack-item-sagobok.PNG"
alt="Otis sagobok"
onclick="openBook('book')">





<img 
class="backpack-item backpack-shell"
src="images/Otis/otis-backpack-item-shell.PNG"
alt="Skal">



<img 
class="backpack-item backpack-blackstone"
src="images/Otis/otis-backpack-item-blackstone.PNG"
alt="Svart sten">





<img 
class="backpack-item backpack-faktabok"
src="images/Otis/otis-backpack-item-faktabok.PNG"
alt="Faktabok"
onclick="openBook('factbook')">





<img 
class="backpack-item backpack-fotoalbum"
src="images/Otis/otis-backpack-item-fotoalbum.PNG"
alt="Fotoalbum"
onclick="openBook('photoalbum')">





<img 
class="backpack-item backpack-oaktwig"
src="images/Otis/otis-backpack-item-oaktwig.PNG"
alt="Ek kvist">





<img 
class="backpack-item backpack-heartstone"
src="images/Otis/otis-backpack-item-heartstone.PNG"
alt="Hjärtsten">





<button id="backpack-close" onclick="closeBackpackRoom()">

🦦 Tillbaka till Otis

</button>



</section>

    <!-- SAGOBOK -->

<section id="storybook" style="display:none;">


<button id="storybook-close" onclick="closeBook()">

🎒 Tillbaka till ryggsäcken

</button>




<button id="storybook-prev" onclick="changeBookPage(-1)">

←

</button>




<img
id="storybook-background"
src="images/Otis/otis-backpack-item-sagobok-openl.PNG"
alt="Boksida">





<img
id="storybook-page"
alt="Otis sagobok">





<!-- Kapitelrubrik -->

<div id="storybook-title"></div>





<!-- Text på boksidor -->

<div id="storybook-text"></div>





<!-- Innehållsförteckning -->

<div id="storybook-content">


<h1>
Innehållsförteckning
</h1>




<button onclick="goToChapter(1)">
Kapitel 1<br>
<span>
Otis och den magiska stenen
</span>
</button>





<button onclick="goToChapter(2)">
Kapitel 2<br>
<span>
När Otis mötte Bosse
</span>
</button>





<button onclick="showComingSoon()">
Kapitel 3<br>
<span>
Kommer snart
</span>
</button>




</div>







<button
id="storybook-read"
class="storybook-read-button"
onclick="bookReadingDone()"
style="display:none;">

📚 Vi har läst en stund

</button>







<button id="storybook-next" onclick="changeBookPage(1)">

→

</button>



</section>


<!-- FAKTABOK -->

<section id="factbook" style="display:none;">

    <button id="factbook-close" onclick="closeFactBook()">
        🎒 Tillbaka till ryggsäcken
    </button>


    <button id="factbook-prev" onclick="changeFactPage(-1)">
        ←
    </button>


    <img
    id="factbook-background"
    src="images/Otis/otis-backpack-item-faktabok-openl.PNG"
    alt="Faktabok sida">


    <img
    id="factbook-page"
    alt="Otis faktabok">


    <div id="factbook-title"></div>


    <div id="factbook-text"></div>


    <div id="factbook-content">

        <h1>Innehållsförteckning</h1>

        <button onclick="goToFactChapter(1)">
            Kapitel 1<br>
            <span>Uttrar</span>
        </button>

        <button onclick="goToFactChapter(2)">
            Kapitel 2<br>
            <span>
            Grävlingar
            </span>
        </button>

        <button onclick="showComingSoon()">
            Kapitel 3<br>
            <span>
            Kommer snart
            </span>
        </button>

    </div>

    <button
id="factbook-read"
class="storybook-read-button"
onclick="factBookReadingDone()"
style="display:none;">

🔍 Vi har upptäckt något nytt

</button>

    <button id="factbook-next" onclick="changeFactPage(1)">
        →
    </button>

</section>

<!-- RECEPTBOK -->

<section id="recipebook" style="display:none;">

    <button id="recipebook-close" onclick="closeBook()">
        🎒 Tillbaka till ryggsäcken
    </button>


    <button id="recipebook-prev" onclick="changeBookPage(-1)">
        ←
    </button>


    <img
    id="recipebook-background"
    src="images/Otis/otis-backpack-item-receptbok-openl.PNG"
    alt="Receptbok sida">


    <img
    id="recipebook-page"
    alt="Otis receptbok">


    <div id="recipebook-title"></div>


    <div id="recipebook-text"></div>


<div id="recipebook-content">

    <h1>Innehåll</h1>


    <h2>Mellanmål</h2>

    <button onclick="goToBookPage(2)">
        <span>Bosses Pannkaksbröd</span>
    </button>


    <h2>Fika</h2>

    <button onclick="goToBookPage(1)">
        <span>Otis Kryddmuffins</span>
    </button>

    <button onclick="goToBookPage(3)">
        <span>Ananas- och mangoglass</span>
    </button>

</div>


    <button id="recipebook-next" onclick="changeBookPage(1)">
        →
    </button>

</section>

    <!-- FOTOALBUM -->
<section id="photoalbum" style="display:none;">
    <button
        id="photoalbum-close"
        onclick="closeBook()">
        🎒 Tillbaka till ryggsäcken
    </button>
    <button
        id="photoalbum-prev"
        onclick="changeBookPage(-1)">
        ←
    </button>
    <img
        id="photoalbum-background"
        src="images/Otis/otis-backpack-item-fotoalbum-openl.PNG"
        alt="Fotoalbum">
    <div id="photoalbum-photos"></div>
    <button
        id="photoalbum-next"
        onclick="changeBookPage(1)">
        →
    </button>
</section>

</main>






<!-- DATA -->


<script src="data/themes.js"></script>




<!-- Vänner -->


<script src="data/friends/otis.js"></script>

<script src="data/friends/index.js"></script>





<!-- Meddelanden -->


<script src="data/messages/greetings.js"></script>

<script src="data/messages/dialogs.js"></script>

<script src="data/messages/onboarding.js"></script>

<script src="data/messages/activities.js"></script>

<script src="data/messages/stories.js"></script>






<!-- FUNKTIONER -->


<script src="js/storage.js"></script>

<script src="js/memory.js"></script>

<script src="js/friends.js"></script>

<script src="data/activities/free.js"></script>

<script src="js/chat.js"></script>

<script src="js/backpack.js"></script>

<script src="js/memory-transfer.js"></script>

<script src="js/activities/math.js"></script>

<script src="js/activities/calm.js"></script>

<script src="js/activities/evening.js"></script>



<!-- Bokdata först -->

<script src="js/storybook.js"></script>

<script src="js/factbook.js"></script>

<script src="js/recipebook.js"></script>

<script src="js/photoalbum.js"></script>


<!-- Bokfunktioner -->

<script src="js/book.js"></script>



<script src="js/ui.js"></script>

<script src="js/app.js"></script>





</body>

</html>
